[workspace]
resolver = "2"
# Backend-keyed layout. live+test each have a struct-mirror crate
# (`seq-eqstructs-<t>`, a Rust mirror of backend/<t>/everquest.h) feeding the
# shared `seq-decode` parsers. eql owns no C wire structs: `seq-backend-eql` is
# a self-contained backend crate holding the offset+scale Legends parsers for
# the 5 diverged opcodes. The active backend is selected via the
# `backend-live` / `backend-test` / `backend-eql` Cargo features on `seq-decode`
# (forwarded from `seq-bridge`); live+eql share the Live struct set + decoders.
members = ["seq-decode", "seq-bridge", "seq-eqstructs-live", "seq-eqstructs-test", "seq-backend-eql"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
authors = ["ShowEQ Developers"]
rust-version = "1.75"

[workspace.dependencies]
cxx = "1"
cxx-build = "1"
thiserror = "2"
seq-decode = { path = "seq-decode", default-features = false }
seq-eqstructs-live = { path = "seq-eqstructs-live" }
seq-eqstructs-test = { path = "seq-eqstructs-test" }
seq-backend-eql = { path = "seq-backend-eql" }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
warnings = "deny"
