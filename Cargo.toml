[workspace]
resolver = "2"
# Backend-keyed layout: each `seq-eqstructs-<backend>` crate mirrors the
# corresponding backend/<t>/everquest.h. The active backend is selected via
# the `backend-live` / `backend-test` / `backend-eql` Cargo features on
# `seq-decode` (forwarded from `seq-bridge`): live+eql share the Live struct
# set (`seq-eqstructs-live`); test has its own (`seq-eqstructs-test`); eql adds
# offset-based Legends parsers on top of the shared Live decoders.
members = ["seq-decode", "seq-bridge", "seq-eqstructs-live", "seq-eqstructs-test"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
authors = ["ShowEQ Developers"]
rust-version = "1.75"

[workspace.dependencies]
cxx = "1"
cxx-build = "1"
thiserror = "2"
seq-decode = { path = "seq-decode", default-features = false }
seq-eqstructs-live = { path = "seq-eqstructs-live" }
seq-eqstructs-test = { path = "seq-eqstructs-test" }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
warnings = "deny"
