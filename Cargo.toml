[workspace]
resolver = "2"
# Backend-keyed layout: each `seq-eqstructs-<backend>` crate mirrors the
# corresponding everquest.h. `seq-decode` and `seq-bridge` stay
# backend-agnostic at the crate level — the active backend is selected
# via the `backend-live` / `backend-quarm` / `backend-test` Cargo
# features on `seq-bridge` (only `backend-live` exists today).
members = ["seq-decode", "seq-bridge", "seq-eqstructs-live"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
authors = ["ShowEQ Developers"]
rust-version = "1.75"

[workspace.dependencies]
cxx = "1"
cxx-build = "1"
thiserror = "2"
seq-decode = { path = "seq-decode" }
seq-eqstructs-live = { path = "seq-eqstructs-live" }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
warnings = "deny"
