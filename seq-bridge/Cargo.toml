[package]
name = "seq-bridge"
description = "C++ FFI bridge (cxx) for the ShowEQ Rust decoder."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

# Backend selection — forwarded to seq-decode (which selects the bindings
# crate + Legends parsers). live+test share the Live decoders (different
# bindings); eql swaps the 5 diverged opcodes for Legends parsers.
[features]
default = ["backend-live"]
backend-live = ["seq-decode/backend-live"]
backend-test = ["seq-decode/backend-test"]
backend-eql  = ["seq-decode/backend-eql"]

[dependencies]
cxx.workspace = true
seq-decode = { workspace = true, default-features = false }

[build-dependencies]
cxx-build.workspace = true

[lints]
workspace = true
