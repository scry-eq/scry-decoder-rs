[package]
name = "seq-eqstructs-eql"
description = "EverQuest Legends wire decoders. eql owns no C wire structs, so unlike seq-eqstructs-{live,test} (struct mirrors) this crate holds the offset+scale parsers for the 5 opcodes whose Legends wire diverges from Live. It produces seq-decode's neutral output structs so the uniform bridge maps them exactly like the Live decoders."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
# For the shared neutral output structs (PlayerProfile, MobUpdate, ...). eql
# reuses the Live decoders for the other ~38 opcodes, so it builds on the Live
# decode stack (backend-live pulls seq-eqstructs-live).
seq-decode = { workspace = true, features = ["backend-live"] }

[lints]
workspace = true
