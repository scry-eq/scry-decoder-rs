[package]
name = "seq-backend-eql"
description = "Self-contained EverQuest Legends decode surface. Vendors its own copies of every parser + output struct + a pinned in-crate eqstructs module (src/bindings.rs, a frozen fork of the live struct layouts), so the eql backend depends on NOTHING from the Live decode stack (seq-decode) — a Live wire patch cannot reach eql. eql's own byte-offset parsers override the vendored copies for the opcodes whose Legends wire diverges; the rest are pinned copies that we now own and diverge only when eql's wire does."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
# seq-events is pure neutral vocabulary + the Backend trait — NO Live decode
# code — so depending on it does not breach eql's isolation (no Live wire parser
# can reach eql through it).
seq-events = { workspace = true }
# No seq-decode / seq-structs dependency: this crate IS the whole eql decode
# stack. The pinned struct layouts live in-crate as the `eqstructs` module
# (src/eqstructs.rs + src/bindings.rs), a frozen fork of the live bindings, so a
# Live everquest.h regen never reaches eql.

[lints]
workspace = true
